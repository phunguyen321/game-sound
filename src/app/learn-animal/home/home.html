<div class="home-container">
  <!-- 1. MÀN HÌNH CHỜ: TAP TO PLAY -->
  @if (screenState() === 'welcome') {
    <div class="welcome-screen" (click)="startExperience()">
      <div class="welcome-card animate-bounce">
        <span class="welcome-icon">🦁</span>
        <h1 class="welcome-title">Thế Giới Động Vật</h1>
        <p class="welcome-subtitle">Khám phá thiên nhiên kỳ thú cùng bé!</p>
        <button class="play-btn">CHẠM ĐỂ BẮT ĐẦU 🚀</button>
      </div>
    </div>
  }

  <!-- 2. MÀN HÌNH VIDEO INTRO -->
  @if (screenState() === 'playing') {
    <div class="video-overlay">
      <video #introVideo playsinline (ended)="onVideoEnded()" class="intro-video">
        <source src="/videos/intro.mp4" type="video/mp4" />
        Trình duyệt của bạn không hỗ trợ thẻ video.
      </video>
    </div>
  }

  <!-- 3. MÀN HÌNH MENU GAME "THẾ GIỚI ĐỘNG VẬT" -->
  @if (screenState() === 'menu') {
    <div class="game-menu animate-fade-in">
      <div class="menu-header">
        <h1 class="menu-title">🌿 THẾ GIỚI ĐỘNG VẬT 🦁</h1>
      </div>

      <div class="game-grid">
        <!-- Game 1: Hành trình tìm con vật -->
        <div class="game-card card-jungle" (click)="selectGame('find-animal')">
          <div class="card-badge">Thám hiểm</div>
          <div class="card-bg-wrapper">
            <img src="/images/find_animal.png" alt="Hành trình tìm con vật" class="game-img" />
          </div>
          <div class="card-content">
            <h3>Hành trình tìm con vật</h3>
          </div>
        </div>

        <!-- Game 2: Nghe âm thanh tập nói -->
        <div class="game-card card-savannah" (click)="selectGame('listen-speak')">
          <div class="card-badge">Tập nói</div>
          <div class="card-bg-wrapper">
            <img src="/images/ga_menu.png" alt="Ai đang kêu đó" class="game-img" />
          </div>
          <div class="card-content">
            <h3>Ai đang kêu đó</h3>
          </div>
        </div>

        <!-- Game 3: Chạm vào vật để nghe -->
        <div class="game-card card-farm" (click)="selectGame('touch-listen')">
          <div class="card-badge">Tương tác</div>
          <div class="card-bg-wrapper">
            <img src="/images/touch_listen.png" alt="Âm nhạc diệu kỳ" class="game-img" />
          </div>
          <div class="card-content">
            <h3>Âm nhạc diệu kỳ</h3>
          </div>
        </div>
      </div>
    </div>
  }
</div>
