<div
  class="flashcard-container"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd()"
  (mousedown)="onMouseDown($event)"
  (mousemove)="onMouseMove($event)"
  (mouseup)="onMouseUp()"
  (mouseleave)="onMouseLeave()"
>
  <div class="flashcard">
    <div
      class="color-box left"
      [style.background]="leftColor().hex"
      (click)="pickColor('left')"
      [class.selected]="selectedSide() === 'left'"
    >
      <div class="label">{{ leftColor().label }}</div>
    </div>

    <div
      class="color-box right"
      [style.background]="rightColor().hex"
      (click)="pickColor('right')"
      [class.selected]="selectedSide() === 'right'"
    >
      <div class="label">{{ rightColor().label }}</div>
    </div>
  </div>
</div>
